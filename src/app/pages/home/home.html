<div class="bg-gray-100 min-h-screen">
  <!-- Hero Section -->
  <section class="bg-blue-600 text-white py-20">
    <div class="max-w-7xl mx-auto px-6 text-center">
      <h1 class="text-4xl md:text-5xl font-bold mb-4">Welcome to Our Store</h1>
      <p class="text-lg mb-6">Discover amazing products at the best prices.</p>

      <a
        routerLink="/products"
        class="bg-white text-blue-600 px-6 py-3 rounded-lg font-semibold hover:bg-gray-200 transition"
      >
        Shop Now
      </a>
    </div>
  </section>

  <!-- Featured Products -->
  <section class="max-w-7xl mx-auto px-6 py-16">
    <h2 class="text-3xl font-bold text-center mb-10">Featured Products</h2>

    <div class="grid gap-8 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
      <div
        *ngFor="let product of featuredProducts"
        class="bg-white shadow-md rounded-xl overflow-hidden hover:shadow-xl transition"
      >
        <!-- Image -->
        <img [src]="product.image" class="w-full h-48 object-cover" />

        <!-- Details -->
        <div class="p-4">
          <h3 class="text-lg font-semibold">
            {{ product.name }}
          </h3>

          <p class="text-gray-600 text-sm mt-1">
            {{ product.description }}
          </p>

          <div class="flex items-center justify-between mt-4">
            <span class="text-blue-600 font-bold text-lg"> ₹ {{ product.price }} </span>

            <button
              class="bg-blue-600 text-white px-3 py-1 rounded-lg hover:bg-blue-700 transition"
            >
              Add to Cart
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Call To Action -->
  <section class="bg-gray-800 text-white py-16">
    <div class="max-w-4xl mx-auto text-center px-6">
      <h2 class="text-3xl font-bold mb-4">Big Sale Coming Soon</h2>

      <p class="mb-6">Subscribe to get updates about our latest deals and offers.</p>

      <button class="bg-blue-600 px-6 py-3 rounded-lg hover:bg-blue-700 transition">
        Subscribe Now
      </button>
    </div>
  </section>
</div>
